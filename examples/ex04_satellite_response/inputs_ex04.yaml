# Input file of the snicar-fx software
# https://github.com/openosmia/snicar-fx

SOLVER:
  TYPE: "multi-stream-disort"
  ATMOSPHERE_COUPLING: true
  OUTPUT_LEVELS: "BOA+TOA"
  N_FOURIER_MODES: 2
  POLAR_ANGLES: [20, 60, 5]
  AZIMUTH_ANGLES: [40, 120, 20]

SPECTRAL:
  MODE: "band-srf-solar-weighted-mean"
  RESOLUTION: "ENVISAT-MERIS"
  
SOLAR:
  SZA: 50
  SAA: 170

ATMOSPHERE:
