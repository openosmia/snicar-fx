[tool.poetry]
name = "snicarfx"
version = "0.1.0"
description = ""
authors = ["snicar-fx team"]
packages = [
    { include = "snicarfx", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = "^2.2.0"
matplotlib = "^3.10"
netCDF4 = "^1.7"
scipy = "^1.11"
xarray = "^2024.0.0"
pyyaml = "^6.0"
pydantic = ">=2.10"
PythonicDISORT = ">=1.6"
pooch = ">=1.8"

[tool.poetry.dev-dependencies]
pytest = "^9.0"

[tool.poetry.scripts]
snicarfx-download-data = "snicarfx.cli.download:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"	
lint.select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "N",  # pep8-naming
    "B",  # bugbear (common bugs)
    "UP", # pyupgrade
    "C4", # comprehensions
    "SIM",# simplify
    "PERF", # performance
    "RUF", # Ruff-specific rules
    "ARG", # unused function arguments
    "DTZ", # datetime tz-aware issues
    "PIE", # misc style issues
    "TCH", # type-checking
]
lint.ignore = [
    "B008",  # function call as default argument
    "SIM105", # use contextlib.suppress (can be overkill)
]
lint.fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["snicarfx"]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
