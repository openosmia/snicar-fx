SOLVER:
  TYPE: "two-stream" # two-stream, multi-stream # UPD
  WVL_START: 205 
  WVL_END: 5000
  RESOLUTION: 10
  ATMOSPHERE_COUPLING: False # explicit surface-atmosphere coupling

SOLAR:
  SZA: 50 

ATMOSPHERE:
  SKY_CONDITIONS: "clear" # clear, cloudy # UPD
  ATMOSPHERIC_PROFILE_TYPE: "afglss"

LAND:
  THICKNESS: [1, 1, 1]  # thickness of each vertical layer (unit : m)
  LAYER_TYPE: [0, 0, 0]  # 0: ice spheres, 1: solid ice w/frsnl, 2: w/out frsnl
  DENSITY: [650, 650, 650]  # density of each layer (unit : kg m-3)
  RF_TYPE: "Pic16" # "Wrn08", "Pic16", "Coop21"
  SPECIFIC_SURFACE_AREA: [1, 1, 1] # m2 kg-1. for ice, should be below ??
  LWC: [0, 0, 0] # LWC content in snow/ice 
  SFC: 0.25 # reflectance of lower boundary  
  GRAIN_SHAPE: [0, 0, 0]  # grain shape: 0 is sphere, 1 is Robledano et al. 2023
  ALTITUDE: 1.0 # surface altitude in km
  
  LIGHT_ABSORBING_PARTICLES:
    BC:
      FILE: "bc_ChCB_rn40_dns1270.nc"
      CONC: [0, 0, 0]

  
  