# Input file of the snicar-fx software
# https://github.com/openosmia/snicar-fx

SOLVER:
  TYPE: "two-stream" # two-stream, multi-stream
  ATMOSPHERE_COUPLING: false # explicit surface-atmosphere coupling

SPECTRAL:
  MODE: "monochromatic" # monochromatic | band-srf-integration | band-snicar-default | band-solar-weighted-mean
  RESOLUTION: [360, 1000, 10] # [start, end, step] or satellite instrument

SOLAR:
  SZA: 50

ATMOSPHERE:
  SKY_CONDITIONS: "clear" # clear, cloudy
  ATMOSPHERIC_PROFILE_TYPE: "afglss"

LAND:  
  THICKNESS: [1, 5, 100]  # thickness of each vertical layer (unit : m) 
  LAYER_TYPE: [0, 0, 0]  # 0: ice spheres, 1: solid ice w/frsnl, 2: w/out frsnl
  DENSITY: [650, 650, 650]  # density of each layer (unit : kg m-3)
  SPECIFIC_SURFACE_AREA: [1, 3, 10] # m2 kg-1. for ice, should be below 3.5
  LWC: [0, 0, 0] # LWC content in snow/ice
  GRAIN_SHAPE: [0,0, 0]  # grain shape: 0 is sphere, 1 is Robledano et al. 2023  
  RF_TYPE: "Coop21" # "Wrn08", "Pic16", "Coop21" # ice refractive index
  SFC: 0 # reflectance of lower boundary  
  ALTITUDE: 0.0 # surface altitude in km
  
  LIGHT_ABSORBING_PARTICLES:
    BC:
      FILE: "bc_ChCB_rn40_dns1270.nc"
      CONC: [0, 0, 0]


